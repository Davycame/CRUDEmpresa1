<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/CSS/styles.css}">
    <title>Fornecedores - Organizações Tabajara</title>
</head>
<body class="page-inner">
    <div class="bg-grid"></div>

    <header class="topbar">
        <div class="topbar-brand">
            <div class="topbar-logo">OT</div>
            <span>Tabajara</span>
        </div>
        <nav class="topbar-nav">
            <a th:href="@{/home}" class="topbar-link">Home</a>
            <a th:href="@{/produtos/listar}" class="topbar-link">Produtos</a>
            <a th:href="@{/fornecedores/listar}" class="topbar-link active">Fornecedores</a>
            <a th:href="@{/pedidos/criar}" class="topbar-link">Pedidos</a>
            <a th:href="@{/relatorios/pedidos}" class="topbar-link">Relatórios</a>
        </nav>
        <form th:action="@{/logout}" method="post" class="logout-form">
            <button type="submit" class="btn btn-outline btn-logout">login off</button>
        </form>
    </header>

    <main class="inner-wrapper">
        <div class="page-header">
            <div>
                <div class="page-header-tag">Módulo</div>
                <h1 class="page-title">Fornecedores</h1>
                <p class="page-sub">Gerencie os fornecedores cadastrados no sistema.</p>
            </div>
            <a th:href="@{/fornecedores/criar}" class="btn btn-primary">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Novo fornecedor
            </a>
        </div>

        <div class="table-card">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Nome</th>
                        <th>CNPJ</th>
                        <th>Telefone</th>
                        <th>Endereço</th>
                        <th>Cidade</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="fornecedor : ${fornecedores}">
                        <td class="td-id" th:text="${fornecedor.idFornecedor}">1</td>
                        <td class="td-main" th:text="${fornecedor.nomeFornecedor}">Nome</td>
                        <td th:text="${fornecedor.cnpjFornecedor}">00.000.000/0000-00</td>
                        <td th:text="${fornecedor.telefoneFornecedor}">(00) 0000-0000</td>
                        <td th:text="${fornecedor.enderecoFornecedor}">Rua Exemplo</td>
                        <td><span class="badge" th:text="${fornecedor.cidadeFornecedor}">Cidade</span></td>
                        <td class="td-actions">
                            <a th:href="@{/fornecedores/editar/{id}(id=${fornecedor.idFornecedor})}" class="action-btn action-edit">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                                Editar
                            </a>
                            <a th:href="@{/fornecedores/excluir/{id}(id=${fornecedor.idFornecedor})}" class="action-btn action-delete" onclick="return confirm('Deseja excluir este fornecedor?')">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
                                Excluir
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
