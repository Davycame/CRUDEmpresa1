<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/CSS/styles.css}">
    <title>Fornecedor - Organizações Tabajara</title>
</head>
<body class="page-inner">
    <div class="bg-grid"></div>

    <header class="topbar">
        <div class="topbar-brand">
            <div class="topbar-logo">OT</div>
            <span>Tabajara</span>
        </div>
        <nav class="topbar-nav">
            <a th:href="@{/home}" class="topbar-link">Home</a>
            <a th:href="@{/produtos/listar}" class="topbar-link">Produtos</a>
            <a th:href="@{/fornecedores/listar}" class="topbar-link active">Fornecedores</a>
            <a th:href="@{/pedidos/criar}" class="topbar-link">Pedidos</a>
        </nav>
    </header>

    <main class="inner-wrapper inner-narrow">
        <div class="page-header">
            <div>
                <div class="page-header-tag">Fornecedores</div>
                <h1 class="page-title">Cadastrar fornecedor</h1>
                <p class="page-sub">Preencha os dados do fornecedor abaixo.</p>
            </div>
        </div>

        <div class="form-card">
            <form th:action="@{/fornecedores/salvar}" method="POST" th:object="${fornecedor}" class="styled-form">
                <input type="hidden" th:field="*{idFornecedor}" />

                <div class="form-grid">
                    <div class="form-field form-field-full">
                        <label for="nomeFornecedor">Nome do fornecedor</label>
                        <div class="input-wrap">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><line x1="12" y1="12" x2="12" y2="16"/><line x1="10" y1="14" x2="14" y2="14"/></svg>
                            <input type="text" id="nomeFornecedor" name="nomeFornecedor" th:field="*{nomeFornecedor}" placeholder="Razão social do fornecedor">
                        </div>
                    </div>

                    <div class="form-field">
                        <label for="cnpjFornecedor">CNPJ</label>
                        <div class="input-wrap">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                            <input type="text" id="cnpjFornecedor" name="cnpjFornecedor" th:field="*{cnpjFornecedor}" placeholder="00.000.000/0000-00">
                        </div>
                    </div>

                    <div class="form-field">
                        <label for="telefoneFornecedor">Telefone</label>
                        <div class="input-wrap">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.41 2 2 0 0 1 3.6 1.22h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.76a16 16 0 0 0 6.29 6.29l.95-.95a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                            <input type="text" id="telefoneFornecedor" name="telefoneFornecedor" th:field="*{telefoneFornecedor}" placeholder="(00) 00000-0000">
                        </div>
                    </div>

                    <div class="form-field form-field-full">
                        <label for="enderecoFornecedor">Endereço</label>
                        <div class="input-wrap">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                            <input type="text" id="enderecoFornecedor" name="enderecoFornecedor" th:field="*{enderecoFornecedor}" placeholder="Rua, número, complemento">
                        </div>
                    </div>

                    <div class="form-field">
                        <label for="cidadeFornecedor">Cidade</label>
                        <div class="input-wrap">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                            <input type="text" id="cidadeFornecedor" name="cidadeFornecedor" th:field="*{cidadeFornecedor}" placeholder="Nome da cidade">
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <a th:href="@{/fornecedores/listar}" class="btn btn-outline">Cancelar</a>
                    <button type="submit" class="btn btn-primary">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                        Salvar fornecedor
                    </button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
