<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/CSS/styles.css}">
    <title>Cadastro de Usuário - Tabajara</title>
</head>
<body class="page-auth">
    <div class="bg-grid"></div>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <div class="auth-split">
        <div class="auth-side-brand">
            <div class="auth-brand-logo">OT</div>
            <h2 class="auth-brand-name">Organizações<br>Tabajara</h2>
            <p class="auth-brand-tagline">Crie seu acesso para operar produtos, fornecedores, pedidos e relatórios.</p>
        </div>

        <div class="auth-side-form">
            <div class="auth-card auth-card-wide">
                <div class="auth-card-header">
                    <h1>Criar conta</h1>
                    <p>Preencha seus dados para se registrar no sistema.</p>
                </div>

                <form th:action="@{/usuarios/salvar}" method="POST" th:object="${usuario}" class="auth-form">
                    <input type="hidden" th:field="*{idUsuario}" />

                    <div class="form-grid">
                        <div class="form-field form-field-full">
                            <label for="nomeUsuario">Nome completo</label>
                            <div class="input-wrap">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                                <input type="text" id="nomeUsuario" name="nomeUsuario" th:field="*{nomeUsuario}" placeholder="Seu nome completo">
                            </div>
                        </div>

                        <div class="form-field form-field-full">
                            <label for="emailUsuario">E-mail</label>
                            <div class="input-wrap">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                                <input type="email" id="emailUsuario" name="emailUsuario" th:field="*{emailUsuario}" placeholder="seu@email.com">
                            </div>
                        </div>

                        <div class="form-field">
                            <label for="loginUsuario">Login</label>
                            <div class="input-wrap">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                                <input type="text" id="loginUsuario" name="loginUsuario" th:field="*{loginUsuario}" placeholder="Nome de usuário">
                            </div>
                        </div>

                        <div class="form-field">
                            <label for="senhaUsuario">Senha</label>
                            <div class="input-wrap">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                                <input type="password" id="senhaUsuario" name="senhaUsuario" th:field="*{senhaUsuario}" placeholder="Crie uma senha segura">
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-full">Criar conta</button>
                </form>

                <div class="auth-card-footer">
                    <a th:href="@{/login}" class="btn btn-ghost btn-full">Já tenho conta → Fazer login</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
